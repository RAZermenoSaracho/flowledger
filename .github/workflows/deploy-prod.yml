name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        run: |
          ssh-keyscan ssh.razs.dev >> ~/.ssh/known_hosts

      - name: Deploy FlowLedger
        run: |
          ssh razs@ssh.razs.dev "~/scripts/deploy-flowledger-prod.sh"
